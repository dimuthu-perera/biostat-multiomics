name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install reference environment
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install package
        run: python -m pip install .
      - name: Verify frozen oracle hashes
        run: python scripts/verify_oracle_hashes.py
      - name: Run maintained suite
        run: python -m pytest -q
      - name: CLI smoke
        run: biostat --version
